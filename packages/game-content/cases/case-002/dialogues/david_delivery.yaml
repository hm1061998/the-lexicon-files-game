tree: david_delivery
npc: david
done: david_interviewed
finish: [david_request_question_done, david_reason_question_done]
notes:
  early_request: david_early_request_read
  request_reason: david_request_reason_read
nodes:
  entry:
    say: I was at reception when we were waiting for the delivery. Please ask what you need.
    vi: Tôi ở quầy tiếp tân khi chúng tôi chờ chuyến giao hàng. Bạn cứ hỏi điều cần biết.
    ask:
      - id: ask_early
        say: When did you ask for the package?
        vi: Bạn hỏi lấy gói hàng lúc nào?
        to: early_request
      - id: ask_reason
        say: Why did you want it early?
        vi: Vì sao bạn muốn lấy sớm?
        to: request_reason
  early_request:
    say: I asked for the [package] [early], at 16:25. Anna told me to wait for the [courier] at 17:00. I stayed at reception; I did not enter the mail room.
    vi: Tôi hỏi lấy gói hàng sớm, lúc 16:25. Anna bảo tôi chờ người chuyển phát đến lúc 17:00. Tôi ở quầy tiếp tân, không vào phòng thư.
    do: [set david_early_request_read]
    ask:
      - id: continue
        say: Continue asking
        vi: Tiếp tục hỏi
        to: entry
        do: [set david_request_question_done]
  request_reason:
    say: It was an [urgent] delivery for the [client]. I wanted to check that the [package] was ready. I waited instead of changing the [schedule].
    vi: Đó là chuyến giao hàng gấp cho khách hàng. Tôi muốn kiểm tra gói hàng đã sẵn sàng. Tôi chờ thay vì đổi lịch trình.
    do: [set david_request_reason_read]
    ask:
      - id: continue
        say: Continue asking
        vi: Tiếp tục hỏi
        to: entry
        do: [set david_reason_question_done]
